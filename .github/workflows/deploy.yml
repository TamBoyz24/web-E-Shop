name: Build and Deploy E-Shop

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-eshop:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/web-eshop:${{ github.sha }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-eshop:api-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/web-eshop:api-${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: mkdir -p /opt/web-eshop

      - name: Copy production Compose configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: docker-compose.production.yml
          target: /opt/web-eshop

      - name: Deploy frontend, API, and MongoDB
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PAYMENTS_PUBLIC_API_BASE_URL: ${{ secrets.PAYMENTS_PUBLIC_API_BASE_URL }}
          PAYMENTS_FRONTEND_RETURN_URL: ${{ secrets.PAYMENTS_FRONTEND_RETURN_URL }}
          BANK_TRANSFER_BANK_NAME: ${{ secrets.BANK_TRANSFER_BANK_NAME }}
          BANK_TRANSFER_ACCOUNT_NAME: ${{ secrets.BANK_TRANSFER_ACCOUNT_NAME }}
          BANK_TRANSFER_ACCOUNT_NUMBER: ${{ secrets.BANK_TRANSFER_ACCOUNT_NUMBER }}
          BANK_TRANSFER_BRANCH: ${{ secrets.BANK_TRANSFER_BRANCH }}
          VNPAY_PAYMENT_URL: ${{ secrets.VNPAY_PAYMENT_URL }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          ZALOPAY_CREATE_ORDER_URL: ${{ secrets.ZALOPAY_CREATE_ORDER_URL }}
          ZALOPAY_APP_ID: ${{ secrets.ZALOPAY_APP_ID }}
          ZALOPAY_KEY1: ${{ secrets.ZALOPAY_KEY1 }}
          ZALOPAY_KEY2: ${{ secrets.ZALOPAY_KEY2 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,MONGODB_URI,JWT_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,PAYMENTS_PUBLIC_API_BASE_URL,PAYMENTS_FRONTEND_RETURN_URL,BANK_TRANSFER_BANK_NAME,BANK_TRANSFER_ACCOUNT_NAME,BANK_TRANSFER_ACCOUNT_NUMBER,BANK_TRANSFER_BRANCH,VNPAY_PAYMENT_URL,VNPAY_TMN_CODE,VNPAY_HASH_SECRET,ZALOPAY_CREATE_ORDER_URL,ZALOPAY_APP_ID,ZALOPAY_KEY1,ZALOPAY_KEY2
          script: |
            set -eu
            cd /opt/web-eshop
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            export DOCKERHUB_USERNAME IMAGE_TAG MONGO_ROOT_USERNAME MONGO_ROOT_PASSWORD MONGODB_URI JWT_KEY ADMIN_USERNAME ADMIN_PASSWORD PAYMENTS_PUBLIC_API_BASE_URL PAYMENTS_FRONTEND_RETURN_URL BANK_TRANSFER_BANK_NAME BANK_TRANSFER_ACCOUNT_NAME BANK_TRANSFER_ACCOUNT_NUMBER BANK_TRANSFER_BRANCH VNPAY_PAYMENT_URL VNPAY_TMN_CODE VNPAY_HASH_SECRET ZALOPAY_CREATE_ORDER_URL ZALOPAY_APP_ID ZALOPAY_KEY1 ZALOPAY_KEY2
            docker compose -f docker-compose.production.yml config --quiet
            docker compose -f docker-compose.production.yml pull
            docker rm -f web-eshop 2>/dev/null || true
            if ! docker compose -f docker-compose.production.yml up -d --remove-orphans; then
              docker compose -f docker-compose.production.yml logs --tail=100
              exit 1
            fi
            docker compose -f docker-compose.production.yml ps
            curl --retry 10 --retry-delay 3 --retry-connrefused -fsS http://localhost/ > /dev/null
            curl --retry 10 --retry-delay 3 --retry-connrefused -fsS http://localhost/api/products > /dev/null
            echo "Frontend and API deployment completed successfully."
