name: web-eshop

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/web-eshop:api-${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      MongoDB__ConnectionString: ${MONGODB_URI:?Set MONGODB_URI}
      MongoDB__DatabaseName: AiPhoneStore
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Admin__Username: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Payments__PublicApiBaseUrl: ${PAYMENTS_PUBLIC_API_BASE_URL:-}
      Payments__FrontendReturnUrl: ${PAYMENTS_FRONTEND_RETURN_URL:-}
      Payments__BankTransfer__BankName: ${BANK_TRANSFER_BANK_NAME:-}
      Payments__BankTransfer__AccountName: ${BANK_TRANSFER_ACCOUNT_NAME:-}
      Payments__BankTransfer__AccountNumber: ${BANK_TRANSFER_ACCOUNT_NUMBER:-}
      Payments__BankTransfer__Branch: ${BANK_TRANSFER_BRANCH:-}
      Payments__VnPay__PaymentUrl: ${VNPAY_PAYMENT_URL:-}
      Payments__VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      Payments__VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Payments__ZaloPay__CreateOrderUrl: ${ZALOPAY_CREATE_ORDER_URL:-}
      Payments__ZaloPay__AppId: ${ZALOPAY_APP_ID:-}
      Payments__ZaloPay__Key1: ${ZALOPAY_KEY1:-}
      Payments__ZaloPay__Key2: ${ZALOPAY_KEY2:-}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/web-eshop:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: web-eshop
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mongodb-data:
    name: ${MONGO_VOLUME_NAME:-web-eshop-mongodb-data}
